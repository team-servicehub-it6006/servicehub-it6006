{% extends 'base.html' %}
{% block title %}Services &middot; ServiceHub{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Our services</h1>
<div class="row g-4">
  {% for service in services %}
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body d-flex flex-column">
          <h2 class="h5">{{ service.name }}</h2>
          <p class="text-muted small flex-grow-1">{{ service.description }}</p>
          <p class="mb-2 small">About {{ service.duration_display }}</p>
          <div class="d-flex justify-content-between align-items-center">
            <strong>from ${{ service.base_price }}</strong>
            <a class="btn btn-sm btn-brand" href="{{ service.get_absolute_url }}">Details</a>
          </div>
        </div>
      </div>
    </div>
  {% endfor %}
</div>
{% endblock %}
