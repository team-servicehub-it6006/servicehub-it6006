{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-{{ width|default:6 }}">
    <h1 class="h3 mb-1">{% block heading %}{{ heading }}{% endblock %}</h1>
    <p class="text-muted">{% block lede %}{{ lede }}{% endblock %}</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include '_form_fields.html' with form=form %}
      <button class="btn btn-brand" type="submit">{% block submit %}{{ submit|default:'Save' }}{% endblock %}</button>
      {% block extra_actions %}{% endblock %}
    </form>
    {% block after_form %}{% endblock %}
  </div>
</div>
{% endblock %}
